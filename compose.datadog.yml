name: npd-datadog

# by using `compose.datadog.yml` alone with `docker compose -f compose.datadog.yml and
# the `extends:` settings for each of the named services, we can merge these
# service definitions cleanly with the ones that already exist in the base
# compose.yml file

services:
  db:
    extends:
      file: compose.yml
      service: db
    env_file: !override
      - path: backend/.env

  db-migrations:
    extends:
      file: compose.yml
      service: db-migrations
    env_file: !override
      - path: backend/.env

  django-web:
    extends:
      file: compose.yml
      service: django-web
    env_file: !override
      - path: .env
    environment:
      DD_AGENT_HOST: datadog-agent
      DD_ENV: "${ENV_KEY:-dev}"
      DD_SERVICE: "django-web"
      DD_VERSION: "1.0.0"
      DD_LOGS_INJECTION: true
    labels:
      com.datadoghq.tags.env: "${ENV_KEY:-dev}"
      com.datadoghq.tags.service: "django-web"
      com.datadoghq.tags.version: "1.0.0"

  web:
    extends:
      file: compose.yml
      service: web

  datadog-agent:
    image: datadog/agent:latest
    environment:
      - DD_API_KEY=${DATADOG_API_KEY:-dummy-api-key}
      - DD_SITE=ddog-gov.com
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    healthcheck:
      test: ["CMD", "agent", "status"]
      interval: 30s
      retries: 3
      timeout: 10s

volumes:
  postgres_data:
  node_modules:
