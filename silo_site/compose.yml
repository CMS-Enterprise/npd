name: bulk-download-site

services:
  app:
    build:
      context: .
    volumes:
      - ./static:/app/static
    ports:
    - "8080:8080"
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_REGION=us-east-1
      - SILO_S3_BUCKET=npd-east-prod-bulk-site
